<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E-Reader Details — EReaders</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="E-reader details, specifications, and list price at EReaders.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Poppins:wght@400;500;600&family=Roboto+Slab:wght@700;800&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  /* ---------- Product details page — store layout ---------- */
  .pdp {
    --cond: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --ink: #1B1B1B;
    --muted: #6B6B6B;
    --line: #E3E3E3;
    --red: #D0342C;
    --soft: 0 2px 10px rgba(0, 0, 0, 0.06);
    padding: 14px var(--safe-r) 0 var(--safe-l);
    font-family: var(--cond);
    color: var(--ink);
  }
  .pdp .container { max-width: 1280px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 0 12px; font-size: 14px; color: #444; border-bottom: 1px solid var(--line); }
  .crumbs a { color: #444; text-decoration: none; }
  .crumbs a:hover { color: var(--red); }
  .crumbs svg { width: 14px; height: 14px; }
  .crumbs [aria-current] { margin-left: 8px; color: #222; }

  .pdp-layout { margin-top: 10px; }
  .card-w { background: #FFFFFF; border-radius: 4px; box-shadow: var(--soft); }

  /* Product rails — horizontal scrolling rows below the product */
  .rail { margin-top: 14px; padding: 18px 22px 16px; }
  .rail > summary { display: flex; align-items: center; gap: 12px; cursor: pointer; list-style: none; }
  .rail > summary::-webkit-details-marker { display: none; }
  .rail > summary::before { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; rotate: -45deg; transition: rotate 0.2s ease; }
  .rail[open] > summary::before { rotate: 45deg; translate: 0 -3px; }
  .rail h2 { font: 700 21px/1.2 var(--sans); color: #000; }
  .rail-all { margin-left: auto; font: 400 15px/1 var(--sans); color: #0A6ACF; text-decoration: none; }
  .rail-all:hover { text-decoration: underline; }
  .rail-wrap { position: relative; margin-top: 18px; }
  .rail-track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, calc((100% - 5px) / 5.5)); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rail-track::-webkit-scrollbar { display: none; }
  .rail-card { scroll-snap-align: start; border-left: 1px solid #E3E3E3; }
  .rail-card:first-child { border-left: 0; }
  .rail-card a { display: block; height: 100%; padding: 12px 20px 16px; font-family: var(--sans); color: #000; text-decoration: none; }
  .rail-card a:hover b, .rail-card a:focus-visible b { text-decoration: underline; }
  .rail-img { position: relative; display: block; aspect-ratio: 1; margin-bottom: 14px; background: #F3F3F5; }
  .rail-img img { position: absolute; inset: 10%; width: 80%; height: 80%; object-fit: contain; }
  .rail-tag { display: inline-block; margin-bottom: 10px; padding: 3px 6px; border: 1.5px solid #555; font: 600 12px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: #333; }
  .rail-tag--soon { border-color: #7A3FB8; color: #7A3FB8; }
  .rail-cat { display: block; font-size: 14px; color: #0A6ACF; }
  .rail-price { display: block; margin-top: 6px; font: 700 18px/1.2 var(--sans); }
  .rail-name { display: block; margin-top: 2px; font-size: 17px; line-height: 1.3; }
  .rail-sub { display: block; margin-top: 4px; overflow: hidden; font-size: 14px; color: #555; white-space: nowrap; text-overflow: ellipsis; }
  .rail-btn { position: absolute; top: 38%; z-index: 1; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: #FFF; background: rgba(60, 60, 60, 0.75); cursor: pointer; transition: opacity 0.2s ease; }
  .rail-btn:hover { background: rgba(30, 30, 30, 0.9); }
  .rail-btn[hidden] { display: none; }
  .rail-btn svg { width: 18px; height: 18px; }
  .rail-prev { left: 6px; }
  .rail-next { right: 6px; }
  .rail-empty { margin-top: 14px; font-size: 15px; color: var(--muted); }

  /* Product box — retail header: big image left, price-led buy panel right */
  .product { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; padding: 28px 28px 32px; font-family: var(--sans); }
  .gallery { position: relative; min-width: 0; }
  .g-main { position: relative; aspect-ratio: 5 / 4; overflow: hidden; }
  .g-track { display: flex; height: 100%; transition: translate 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .g-slide { position: relative; flex: 0 0 100%; }
  .g-slide img { position: absolute; left: 6%; top: 4%; width: 88%; height: 92%; object-fit: contain; }
  .dots { display: flex; justify-content: center; gap: 4px; margin-top: 18px; }
  .dots button { width: 18px; height: 18px; display: grid; place-items: center; cursor: pointer; }
  .dots button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #555; transition: background-color 0.2s ease; }
  .dots button[aria-current="true"]::before { background: #555; }
  .g-count { display: block; margin-top: 8px; text-align: center; font-size: 15px; color: #0A6ACF; }
  .g-note { margin-top: 10px; font-size: 12px; line-height: 1.45; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .g-track { transition: none; } }

  .info { display: flex; flex-direction: column; min-width: 0; color: #000; }
  .tag { align-self: flex-start; padding: 3px 7px; border: 1.5px solid #555; font: 600 13px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: #333; }
  .tag--soon { border-color: #7A3FB8; color: #7A3FB8; }
  .big-price { margin-top: 10px; font: 700 clamp(26px, 2.6vw, 32px)/1.1 var(--sans); letter-spacing: -0.01em; }
  .big-price--tbc { font-size: 22px; }
  .info h1 { font: 400 clamp(24px, 2.6vw, 32px)/1.2 var(--sans); letter-spacing: -0.01em; }
  .info h1 b { font-weight: 700; }
  .sub { margin-top: 10px; font-size: 15px; color: #111; }
  .price-note { margin-top: 14px; font-size: 15px; color: #555; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; margin-top: 30px; }
  .meta > div { padding-right: 20px; }
  .meta > div + div { padding-left: 24px; border-left: 1px solid #DDD; }
  .meta small { display: block; font-size: 13px; color: #555; }
  .meta span, .meta a { display: block; margin-top: 4px; font-size: 15px; color: #111; }
  .meta a { color: #0A6ACF; text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  /* Option cards (versions / colour / storage) */
  .opts { margin-top: 28px; }
  .opts + .opts { margin-top: 22px; }
  .opts h2 { display: flex; align-items: center; gap: 10px; font: 600 16px/1.2 var(--sans); }
  .opts h2 span { display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; font: 500 13px/1 var(--sans); background: #EDEDED; }
  .opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; margin-top: 12px; }
  .opt-card { display: flex; flex-direction: column; min-height: 72px; border: 1px solid #DDD; border-radius: 3px; background: #FFF; color: #111; text-align: left; text-decoration: none; overflow: hidden; cursor: pointer; transition: border-color 0.2s ease; }
  .opt-card:hover { border-color: #999; }
  .opt-card[aria-current="page"], .opt-card[aria-pressed="true"] { border: 2px solid #333; }
  .opt-img { position: relative; display: block; height: 110px; background: #F4F4F4; }
  .opt-img img { position: absolute; left: 10%; top: 8%; width: 80%; height: 84%; object-fit: contain; }
  .opt-body { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; }
  .opt-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; font-size: 15px; line-height: 1.3; }
  .opt-top svg { flex: none; width: 14px; height: 14px; margin-top: 2px; color: #7A3FB8; }
  .opt-price { font-size: 14px; color: #555; }
  .avail { display: grid; grid-template-columns: 20px 1fr; gap: 4px; margin-top: auto; padding-top: 40px; font-size: 15px; line-height: 1.6; color: #1F7A3F; }
  .avail--soon { color: #7A3FB8; }
  .avail svg { width: 15px; height: 15px; margin-top: 4px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .btn-cart, .btn-grey { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 3px; font: 500 15px/1 var(--sans); white-space: nowrap; text-decoration: none; cursor: pointer; transition: background-color 0.2s ease, color 0.2s ease; }
  .btn-cart { grid-column: 1 / -1; color: #111; background: #FFF; box-shadow: inset 0 0 0 1px #CCC; }
  .btn-cart:hover { background: #F5F5F5; }
  .btn-grey { color: #111; background: #EAEAEA; box-shadow: inset 0 0 0 1px #D2D2D2; }
  .btn-grey:hover { background: #DFDFDF; }
  .btn-grey[aria-pressed="true"] { background: #DDEBFB; box-shadow: inset 0 0 0 1px #9CC2EE; }
  .btn-grey:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-cart svg, .btn-grey svg { width: 18px; height: 18px; flex: none; }
  .btn-black { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 3px; font: 500 16px/1 var(--sans); color: #FFF; background: #111; text-decoration: none; }
  .compare-status { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .compare-status:empty { display: none; }
  .compare-status a { color: #0A6ACF; }
  .ship-note { margin-top: 14px; font-size: 15px; color: #555; }

  /* Tabs */
  .details { margin-top: 14px; }
  .tablist { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 18px 0; border-bottom: 1px solid var(--line); }
  .tablist button { height: 44px; padding: 0 20px; border-radius: 4px 4px 0 0; font: 500 17px/1 var(--cond); color: #333; cursor: pointer; }
  .tablist button:hover { color: var(--red); }
  .tablist button[aria-selected="true"] { color: #FFF; background: #111; }
  .tabpanel { padding: 20px 18px 24px; }
  .spec-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .spec-table .group th { padding: 10px 12px; font: 600 17px/1.2 var(--cond); color: var(--ink); background: #F1F1F1; text-align: left; }
  .spec-table th[scope="row"], .spec-table td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid #EEE; }
  .spec-table th[scope="row"] { width: 32%; font-weight: 400; color: #555; }
  .desc h2 { font: 700 22px/1.3 var(--cond); margin-bottom: 10px; }
  .desc > p { font-size: 17px; color: #333; max-width: 900px; }
  .fit-list { display: grid; gap: 12px; margin-top: 18px; padding-left: 20px; list-style: disc; }
  .fit-list li { font-size: 17px; color: #333; }
  .fit-list strong { font-weight: 600; color: var(--ink); }

  .not-found { display: grid; justify-items: start; gap: 14px; margin-top: 20px; padding: 40px; }
  .not-found h1 { font: 700 clamp(30px, 4vw, 42px)/1.1 var(--cond); }
  .not-found p { font-size: 17px; color: var(--muted); max-width: 520px; }

  .buy-bar { display: none; }

  @media (max-width: 1000px) {
    .rail-track { grid-auto-columns: minmax(180px, calc((100% - 3px) / 3.4)); }
  }
  @media (max-width: 760px) {
    .product { grid-template-columns: 1fr; padding: 14px; }
    .product { gap: 24px; }
    .avail { padding-top: 24px; }
    .tablist { padding: 10px 10px 0; }
    .tablist button { padding: 0 14px; font-size: 16px; }
    .tabpanel { padding: 14px 10px 18px; }
    .spec-table th[scope="row"] { width: 42%; }
    .buy-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding: 8px var(--safe-r) calc(8px + env(safe-area-inset-bottom)) var(--safe-l);
      background: #EFEFEF;
    }
    .buy-bar a { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 4px; font: 500 17px/1 "Barlow Semi Condensed", sans-serif; text-transform: uppercase; text-decoration: none; color: #FFF; }
    .buy-bar a:first-child { background: #111; }
    .buy-bar a:last-child { background: #2B3440; }
    .site-footer { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  }
</style>
</head>

<div class="bg" aria-hidden="true"><canvas id="stars"></canvas></div>

<div class="page">
  <header class="site-header">

      <a class="brand" href="index.html" aria-label="EReaders home">

          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#support">Support</a></li>
        </ul>
        <a class="btn-lit btn-lit--nav" href="products.html">Explore Devices</a>
      </div>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-menu" aria-label="Open menu">
        <svg class="icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>

  <main id="main" class="pdp">

      <!-- Rendered from catalog.js using ?id=<product-id>. -->

  <footer class="site-footer">

        <a href="products.html">E-Readers</a>

        <a href="index.html#support">Support</a>
      </nav>
      <p class="footer-note">© <span data-year>2026</span> EReaders. Kindle, BOOX, and Kobo are trademarks of their respective owners. Device artwork on this page is illustrative.</p>
    </div>
  </footer>
</div>

<script src="catalog.js"></script>
<script src="site.js"></script>
<script>
(function () {
  'use strict';
  const C = window.EReadersCatalog;
  const UI = window.EReadersUI;
  const { $, $$ } = UI;
  const esc = C.esc;
  const root = $('#pdp-root');

  const id = new URLSearchParams(location.search).get('id');
  const p = id && Object.prototype.hasOwnProperty.call(C.byId, id) ? C.byId[id] : null;

  const BRAND_LOGOS = {
    kindle: { src: 'assets/brands/Amazon_Kindle_2024.svg' },
    kobo: { src: 'assets/brands/Kobo_logo.svg' },
    boox: { src: 'assets/brands/BOOX_logo.png', invert: true }
  };
  const HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>';
  const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const CART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>';
  const GRID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>';
  const EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  function crumbs(parts) {
    return '<nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" aria-label="Home">' + HOME + '</a>' +
      parts.map((x) => '<span aria-hidden="true">&gt;</span>' + x).join('') + '</nav>';
  }

  function renderNotFound() {
    document.title = 'Product not found — EReaders';
    root.innerHTML = crumbs(['<a href="products.html">E-Readers</a>']) +
      '<section class="not-found card-w" aria-labelledby="nf-title">' +
        '<h1 id="nf-title">We couldn’t find that e-reader.</h1>' +
        '<p>The link may be out of date, or the device is no longer listed.</p>' +
        '<a class="btn-black" href="products.html">Browse all e-readers</a>' +
      '</section>';
  }

  function fitNotes(p) {
    const notes = [];
    const inches = parseFloat(p.screen);
    if (!isNaN(inches)) {
      if (inches < 6.5) notes.push(['Pocket-friendly size', 'A ' + p.screen + '-inch screen is easy to carry and hold in one hand.']);
      else if (inches < 9) notes.push(['Balanced size', 'A ' + p.screen + '-inch screen gives more room per page while staying portable.']);
      else notes.push(['Large screen', 'A ' + p.screen + '-inch screen suits documents, PDFs, and notes as well as books.']);
    }
    if (p.colour === true) notes.push(['Colour display', 'Covers, comics, and highlights can be shown in colour.']);
    if (p.colour === false) notes.push(['Focused on text', 'A black-and-white E Ink display dedicated to reading.']);
    if (p.pen === true) notes.push(['Write and annotate', p.form === 'pen' ? 'Designed for writing and markup with a stylus, as well as reading.' : 'Supports a stylus for notes and markup.']);
    if (p.buttons) notes.push(['Physical page buttons', 'Turn pages with buttons as well as the touchscreen.']);
    if (p.status === 'coming-soon') notes.push(['Coming soon', 'This device has been announced but isn’t available to buy yet.']);
    return notes;
  }

  /* "Same Category" = same device type (pen tablets vs readers) from other brands. */
  const category = (x) => (x.form === 'pen' ? 'pen' : 'reader');
  const ARROW = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (d < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6') + '"/></svg>';
  function railHTML(id, title, list, allUrl) {
    const cards = list.map((x) => {
      const soon = x.status === 'coming-soon';
      const rest = x.name.replace(x.brandName, '').trim();
      return '<li class="rail-card"><a href="' + x.url + '">' +
        '<span class="rail-img"><img src="' + ((x.images && x.images[0]) || x.image) + '" alt=""></span>' +
        (soon ? '<span class="rail-tag rail-tag--soon">Coming soon</span>' : '') +
        '<span class="rail-cat">' + (category(x) === 'pen' ? 'E-ink tablets' : 'E-readers') + '</span>' +
        '<span class="rail-price">' + (C.formatPrice(x) || 'Price coming soon') + '</span>' +
        '<span class="rail-name"><b>' + esc(x.brandName) + '</b>' + (rest ? ' ' + esc(rest) : '') + '</span>' +
        '<span class="rail-sub">' + C.specChips(x).map(esc).join(', ') + '</span></a></li>';
    }).join('');
    return '<details class="card-w rail" open aria-labelledby="' + id + '"><summary><h2 id="' + id + '">' + title + '</h2>' +
      '<a class="rail-all" href="' + allUrl + '">Show all &rarr;</a></summary>' +
      (list.length
        ? '<div class="rail-wrap"><button type="button" class="rail-btn rail-prev" data-rail="-1" aria-label="Scroll back" hidden>' + ARROW(-1) + '</button>' +
          '<ul class="rail-track">' + cards + '</ul>' +
          '<button type="button" class="rail-btn rail-next" data-rail="1" aria-label="Scroll forward">' + ARROW(1) + '</button></div>'
        : '<p class="rail-empty">No other devices listed yet.</p>') +
      '</details>';
  }

  function compareStatus(compare) {
    const inCompare = compare.includes(p.id);
    if (inCompare && compare.length >= 2) return 'Added. <a href="products.html?compare=1">View comparison (' + compare.length + ')</a>';
    if (inCompare) return 'Added. Choose one more device to compare. <a href="products.html">Browse e-readers</a>';
    if (compare.length >= C.MAX_COMPARE) return 'Your compare list is full. <a href="products.html?compare=1">View comparison</a>';
    return '';
  }

  function compareBtnHTML(compare) {
    const on = compare.includes(p.id);
    const full = !on && compare.length >= C.MAX_COMPARE;
    return '<button class="btn-grey" type="button" data-compare aria-pressed="' + on + '"' +
      (full ? ' disabled title="You can compare up to ' + C.MAX_COMPARE + ' devices"' : '') + '>' +
      (on ? CHECK : PLUS) + '<span>' + (on ? 'In compare list' : 'Compare') + '</span></button>';
  }

  function specRows() {
    const groups = [
      ['General', [['Brand', esc(p.brandName)], ['Product Model', esc(p.name)], ['Availability', C.statusLabel(p)]]],
      ['Display', [['Screen Size', p.screen ? esc(p.screen) + '"' : null], ['Display Type', C.displayLabel(p)]]],
      ['Memory', [['Storage', p.options && p.options.Storage ? p.options.Storage.map((o) => esc(o.label)).join(' / ') : null]]],
      ['Main Features', [['Pen Support', C.yesNo(p.pen)], ['Page-turn Buttons', C.yesNo(p.buttons)]]],
      ['Price', [['List Price', C.formatPrice(p) ? C.formatPrice(p) + ' (USD)' : 'Coming soon']]]
    ];
    return groups.map((g) => [g[0], g[1].filter((r) => r[1])]).filter((g) => g[1].length).map((g) =>
      '<tbody><tr class="group"><th colspan="2" scope="colgroup">' + g[0] + '</th></tr>' +
        g[1].map((r) => '<tr><th scope="row">' + r[0] + '</th><td>' + r[1] + '</td></tr>').join('') +
      '</tbody>').join('');
  }

  const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  /* Option sections: family versions (links to sibling pages) + any catalog "options" (selectable). */
  function optionsHTML() {
    let html = '';
    const family = p.family ? C.PRODUCTS.filter((x) => x.family === p.family) : [];
    if (family.length > 1) {
      html += '<section class="opts" aria-labelledby="opt-version"><h2 id="opt-version">Version <span>' + family.length + '</span></h2><div class="opt-grid">' +
        family.map((x) => '<a class="opt-card" href="' + x.url + '"' + (x.id === p.id ? ' aria-current="page"' : '') + '>' +
          '<span class="opt-img"><img src="' + ((x.images && x.images[0]) || x.image) + '" alt=""></span>' +
          '<span class="opt-body"><span class="opt-top">' + esc(x.variant || x.name) + (x.status === 'coming-soon' ? CLOCK : '') + '</span>' +
          '<span class="opt-price">' + (C.formatPrice(x) || 'Price coming soon') + '</span></span></a>').join('') +
      '</div></section>';
    }
    Object.keys(p.options || {}).forEach((group, g) => {
      const list = p.options[group] || [];
      if (!list.length) return;
      html += '<section class="opts" aria-labelledby="opt-' + g + '"><h2 id="opt-' + g + '">' + esc(group) + ' <span>' + list.length + '</span></h2><div class="opt-grid" role="group" aria-labelledby="opt-' + g + '">' +
        list.map((o, i) => '<button type="button" class="opt-card" data-opt="' + g + '"' + (typeof o.price === 'number' ? ' data-price="' + o.price + '"' : '') + ' aria-pressed="' + (i === 0) + '">' +
          (o.image ? '<span class="opt-img"><img src="' + o.image + '" alt=""></span>' : '') +
          '<span class="opt-body"><span class="opt-top">' + esc(o.label) + (p.status === 'coming-soon' ? CLOCK : '') + '</span>' +
          (typeof o.price === 'number' ? '<span class="opt-price">' + C.money.format(o.price) + '</span>' : '') + '</span></button>').join('') +
      '</div></section>';
    });
    return html;
  }

  function render() {
    const compare = C.loadCompare();
    const brandUrl = 'products.html#brand=' + p.brand;
    const price = C.formatPrice(p);
    const soon = p.status === 'coming-soon';
    const images = Array.isArray(p.images) && p.images.length ? p.images : [p.image];
    const features = C.specChips(p);
    const logo = BRAND_LOGOS[p.brand];
    const model = p.name.replace(p.brandName, '').trim() || p.name;
    const sameCat = C.PRODUCTS.filter((x) => x.id !== p.id && x.brand !== p.brand && category(x) === category(p));
    const sameBrand = C.PRODUCTS.filter((x) => x.id !== p.id && x.brand === p.brand);
    const storeLink = (label, cls) => '<a class="' + cls + '" href="' + p.store + '" target="_blank" rel="noopener noreferrer">' + label + '<span class="visually-hidden"> (opens in a new tab)</span></a>';

    root.innerHTML =
      crumbs(['<a href="products.html">E-Readers</a>', '<a href="' + brandUrl + '">' + esc(p.brandName) + '</a>', '<span aria-current="page">' + esc(p.name) + '</span>']) +

      '<div class="pdp-layout">' +

        '<div class="pdp-main">' +
          '<article class="card-w product">' +
            '<div class="gallery">' +
              '<div class="g-main" id="g-main" role="region" aria-roledescription="carousel" aria-label="Product images"><div class="g-track" id="g-track">' +
                images.map((src, i) => '<div class="g-slide" role="group" aria-roledescription="slide" aria-label="' + (i + 1) + ' of ' + images.length + '"' + (i ? ' aria-hidden="true"' : '') + '><img src="' + src + '" alt="' + (i ? '' : esc(p.alt)) + '"></div>').join('') +
              '</div></div>' +
              (images.length > 1 ? '<div class="dots">' + images.map((_, i) => '<button type="button" data-img="' + i + '" aria-label="Show image ' + (i + 1) + '"' + (i ? '' : ' aria-current="true"') + '></button>').join('') + '</div>' : '') +
              '<span class="g-count">' + images.length + (images.length === 1 ? ' image' : ' images') + '</span>' +
              (p.images ? '' : '<p class="g-note">Illustration — not a photo of the product.</p>') +
            '</div>' +

            '<div class="info">' +
              '<span class="tag' + (soon ? ' tag--soon' : '') + '">' + (soon ? 'Coming soon' : 'Available') + '</span>' +
              '<p class="big-price' + (price ? '' : ' big-price--tbc') + '" id="big-price">' + (price || 'Price coming soon') + '</p>' +
              '<h1><b>' + esc(p.brandName) + '</b>' + (p.name.replace(p.brandName, '').trim() ? ' ' + esc(p.name.replace(p.brandName, '').trim()) : '') + '</h1>' +
              (features.length ? '<p class="sub">' + features.map(esc).join(', ') + '</p>' : '') +
              '<p class="price-note">' + (price ? 'Manufacturer list price in USD' : 'Price not announced yet') + '</p>' +
              '<div class="meta">' +
                '<div><small>Display</small><span>' + (C.displayLabel(p) || 'E Ink') + '</span></div>' +
                '<div><small>Brand</small><a href="' + brandUrl + '">More from ' + esc(p.brandName) + '</a></div>' +
              '</div>' +
              optionsHTML() +
              '<p class="avail' + (soon ? ' avail--soon' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>' +
                (soon ? 'Announced — not available to order yet.<br>Check the ' + esc(p.brandName) + ' store for release dates.' : 'Available from the ' + esc(p.brandName) + ' store.<br>Delivery times depend on the retailer.') + '</span></p>' +
              '<div class="actions" id="actions">' +
                storeLink(CART + 'Buy from ' + esc(p.brandName) + ' store', 'btn-cart') +
                compareBtnHTML(compare) +
                '<a class="btn-grey" href="products.html">' + GRID + 'All e-readers</a>' +
              '</div>' +
              '<p class="compare-status" id="compare-status" aria-live="polite">' + compareStatus(compare) + '</p>' +
              '<p class="ship-note">Prices and shipping are set by the retailer.</p>' +
            '</div>' +
          '</article>' +

          '<section class="card-w details" aria-label="Product information">' +
            '<div class="tablist" role="tablist" aria-label="Product information">' +
              '<button type="button" role="tab" id="tab-spec" aria-controls="panel-spec" aria-selected="true">Specification</button>' +
              '<button type="button" role="tab" id="tab-desc" aria-controls="panel-desc" aria-selected="false" tabindex="-1">Description</button>' +
            '</div>' +
            '<div class="tabpanel" role="tabpanel" id="panel-spec" aria-labelledby="tab-spec" tabindex="0"><table class="spec-table">' + specRows() + '</table></div>' +
            '<div class="tabpanel desc" role="tabpanel" id="panel-desc" aria-labelledby="tab-desc" tabindex="0" hidden>' +
              '<h2>' + esc(p.name) + '</h2><p>' + esc(p.blurb) + '</p>' +
              '<ul class="fit-list">' + fitNotes(p).map((n) => '<li><strong>' + n[0] + '</strong> — ' + esc(n[1]) + '</li>').join('') + '</ul>' +
            '</div>' +
          '</section>' +
          railHTML('rail-similar', 'Similar Devices', sameCat, 'products.html') +
          railHTML('rail-brand', 'More from ' + esc(p.brandName), sameBrand, brandUrl) +
        '</div>' +
      '</div>' +

      '<div class="buy-bar">' + storeLink('Buy now', '') + '<a href="products.html">All e-readers</a></div>';
  }

  function updateCompare(focus) {
    const compare = C.loadCompare();
    $('#actions [data-compare]').outerHTML = compareBtnHTML(compare);
    $('#compare-status').innerHTML = compareStatus(compare);
    if (focus) $('#actions [data-compare]').focus();
  }


  function selectTab(tab, focus) {
    $$('[role="tab"]', root).forEach((t) => {
      const on = t === tab;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      $('#' + t.getAttribute('aria-controls')).hidden = !on;
    });
    if (focus) tab.focus();
  }

  if (!p) { renderNotFound(); return; }

  document.title = p.name + ' — EReaders';
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', p.name + ' by ' + p.brandName + '. ' + p.blurb + ' Specifications and list price at EReaders.');
  render();

  /* ---- Auto-advancing image slider (pauses on hover/focus, off for reduced motion) ---- */
  const slides = $$('.g-slide', root);
  let current = 0, timer = 0;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  function goTo(i) {
    current = (i + slides.length) % slides.length;
    $('#g-track').style.translate = (-100 * current) + '% 0';
    slides.forEach((s, n) => { s.setAttribute('aria-hidden', String(n !== current)); });
    $$('.dots [data-img]', root).forEach((b, n) => { if (n === current) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  }
  function stop() { clearInterval(timer); timer = 0; }
  function restart() {
    stop();
    if (slides.length > 1 && !reduced.matches && !document.hidden) timer = setInterval(() => goTo(current + 1), 3500);
  }
  const gallery = $('.gallery', root);
  gallery.addEventListener('pointerenter', stop);
  gallery.addEventListener('pointerleave', restart);
  gallery.addEventListener('focusin', stop);
  gallery.addEventListener('focusout', (e) => { if (!gallery.contains(e.relatedTarget)) restart(); });
  document.addEventListener('visibilitychange', restart);
  restart();

  /* Rails: arrow buttons page the track; hide each arrow at its end */
  function syncRail(track) {
    const wrap = track.parentElement;
    wrap.querySelector('.rail-prev').hidden = track.scrollLeft <= 2;
    wrap.querySelector('.rail-next').hidden = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
  }
  $$('.rail-track', root).forEach((t) => {
    t.addEventListener('scroll', () => syncRail(t), { passive: true });
    syncRail(t);
  });
  window.addEventListener('resize', () => $$('.rail-track', root).forEach(syncRail));
  root.addEventListener('toggle', (e) => {
    const t = e.target.matches('.rail[open]') && e.target.querySelector('.rail-track');
    if (t) syncRail(t);
  }, true);

  root.addEventListener('click', function (e) {
    const railBtn = e.target.closest('[data-rail]');
    if (railBtn) {
      const track = railBtn.parentElement.querySelector('.rail-track');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      track.scrollBy({ left: Number(railBtn.dataset.rail) * track.clientWidth * 0.9, behavior: reduce ? 'auto' : 'smooth' });
      return;
    }
    const cmp = e.target.closest('[data-compare]');
    if (cmp && !cmp.disabled) {
      const ids = C.loadCompare();
      const i = ids.indexOf(p.id);
      if (i >= 0) ids.splice(i, 1);
      else if (ids.length < C.MAX_COMPARE) ids.push(p.id);
      C.saveCompare(ids);
      updateCompare(true);
      return;
    }
    const opt = e.target.closest('[data-opt]');
    if (opt) {
      $$('[data-opt="' + opt.dataset.opt + '"]', root).forEach((b) => b.setAttribute('aria-pressed', String(b === opt)));
      if (opt.dataset.price) $('#big-price').textContent = C.money.format(+opt.dataset.price);
      return;
    }
    const tab = e.target.closest('[role="tab"]');
    if (tab) { selectTab(tab, false); return; }
    const thumb = e.target.closest('[data-img]');
    if (thumb) { goTo(+thumb.dataset.img); restart(); }
  });
  root.addEventListener('keydown', function (e) {
    const tab = e.target.closest('[role="tab"]');
    if (!tab || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    const tabs = $$('[role="tab"]', root);
    const next = tabs[(tabs.indexOf(tab) + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    e.preventDefault();
    selectTab(next, true);
  });
  window.addEventListener('storage', function (e) { if (e.key === 'ereaders-compare') updateCompare(false); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) updateCompare(false); });
})();
</script>
</body>
